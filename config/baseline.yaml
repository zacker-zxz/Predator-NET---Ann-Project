# =============================================================================
# PREDATOR NET — Baseline Configuration
# =============================================================================
# This file defines all parameters for the baseline dense ANN experiment.
# Every parameter is configurable. Do NOT hard-code values in source code.

project:
  name: PREDATOR_NET
  seed: 42
  device: auto          # auto | cuda | cpu
  mixed_precision: true # Use AMP on CUDA where appropriate

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  dataset: CIC-IDS2017
  raw_dir: data/cic-ids-2017/MachineLearningCVE
  interim_dir: data/interim
  processed_dir: data/processed
  label_column: auto        # Auto-detect from CSV
  storage_format: parquet   # parquet | npy | both
  float_dtype: float32

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  mode: behavioral          # behavioral | enriched
  correlation_threshold: 0.95
  mutual_information: true
  model_based_importance: false  # Optional RF-based ranking

# ---------------------------------------------------------------------------
# Data Splitting
# ---------------------------------------------------------------------------
splitting:
  protocol: stratified       # stratified | leakage_aware | temporal
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

# ---------------------------------------------------------------------------
# Model Architecture
# ---------------------------------------------------------------------------
model:
  type: baseline_mlp
  hidden_dims:
    - 128
    - 64
    - 32
  activation: relu
  dropout: 0.0              # Disabled for baseline
  batch_norm: false          # Disabled for baseline

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 1024
  epochs: 50
  early_stopping:
    enabled: true
    patience: 8
    monitor: val_f1
    mode: max
  scheduler:
    enabled: false
    type: reduce_on_plateau
    factor: 0.5
    patience: 5

# ---------------------------------------------------------------------------
# Class Imbalance
# ---------------------------------------------------------------------------
class_weighting:
  enabled: true
  method: pos_weight        # pos_weight = neg_count / pos_count

# ---------------------------------------------------------------------------
# Classification Threshold
# ---------------------------------------------------------------------------
threshold:
  default: 0.5
  tune_on_validation: true
  metric: f1                # Optimize threshold for this metric

# ---------------------------------------------------------------------------
# Artifacts
# ---------------------------------------------------------------------------
artifacts:
  base_dir: artifacts
  save_model: true
  save_plots: true
  save_metrics: true
