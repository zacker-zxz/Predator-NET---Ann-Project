[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predator-net"
version = "0.1.0"
description = "PREDATOR NET: Adaptive Neural Network for Network Intrusion Detection Using Knowledge-Preserving Neuron Absorption"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Tejas"},
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "polars>=0.20",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "tabulate>=0.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
    "psutil>=5.9",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
demo = [
    "streamlit>=1.30",
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
